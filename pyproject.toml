[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llminator"
version = "0.1.0"
description = "CLI-first security testing for ML and LLM systems"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pydantic>=2.7",
  "PyYAML>=6.0",
  "rich>=13.7",
  "typer>=0.12",
]

[project.optional-dependencies]
ml = [
  "adversarial-robustness-toolbox>=1.20",
  "onnx>=1.16",
  "onnxruntime>=1.18",
  "torch>=2.2",
]
ui  = ["flask>=3.0"]
dev = ["pytest>=8.0"]

[project.scripts]
llminator    = "llminator.main:app"
llminator-ui = "llminator.ui.server:main"

[tool.hatch.build.targets.wheel]
packages = ["llminator"]
artifacts = ["llminator/ui/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
